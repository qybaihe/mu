name: Bug report
description: Something in mu or the desktop app does not work as it should. 报告 bug。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A short report that someone else can reproduce is the most useful kind. English or Chinese, both fine. 中英文都可以。

        Search [existing issues](https://github.com/qybaihe/mu/issues?q=is%3Aissue) first. Security problems go to the [private report form](https://github.com/qybaihe/mu/security/advisories/new), not here.

  - type: dropdown
    id: part
    attributes:
      label: Where
      description: Which part of mu is it in?
      options:
        - Desktop app
        - Command line (mu)
        - Both
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`mu --version`, or the desktop app's About page."
      placeholder: "mu-agent 0.1.7 / desktop 0.1.6"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, and the terminal for the command line.
      placeholder: "macOS 16.1 (Apple silicon) / Windows 11 x64 / Ubuntu 24.04, kitty"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including error messages. What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The fewest steps that make it happen.
      placeholder: |
        1. Start mu in a 24-column terminal
        2. Ask for a sub-agent
        3. ...
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Model, judge and settings
      description: |
        The model, the judge (`/status` shows it; "free Jev", Jev with a key, Laya…), the permission mode, and any setting you changed. Never paste keys.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: |
        `mu doctor` output, the relevant part of a log, or a screenshot. The desktop app's log folder is under Settings → About. Remove anything private.
      render: text
    validations:
      required: false
