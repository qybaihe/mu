name: Windows tests

# mu's own tests on Windows, where none of its developers has a machine: the desktop app's mu unit tests
# (desktop/tests/unit/kyrn) and the judgment layer's (packages/kyrn-judge), which holds the launcher's too. Green since
# 2026-09-25 (run 36108731023), so it runs on every change like CI, in about three minutes; a change to text alone
# does not start it. The permission round trip has a workflow of its own (windows-permission.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows · desktop mu unit tests
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24, as in CI's other jobs: the duration and list formats in the tests follow its ICU.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: mu unit tests
        run: bunx vitest run tests/unit/kyrn

  harness:
    name: Windows · judgment layer tests
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # As in CI's harness job: some tests start child processes that load the built packages.
      - name: Build
        run: npm run build

      - name: Judgment layer tests
        working-directory: packages/kyrn-judge
        run: npx vitest run
