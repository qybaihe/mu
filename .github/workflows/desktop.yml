name: Desktop app

# Builds the desktop app (desktop/, an AionUi fork) for macOS, Windows and Linux on x64 and arm64.
# A push to main that touches the app keeps the installers as workflow artifacts; a `v*` tag also
# publishes them, with a source archive, as a GitHub pre-release.
#
# The installed app updates itself from the newest of these releases (electron-updater), so a release also
# carries the update feed: latest-mac.yml, latest.yml (Windows), latest-linux.yml and latest-linux-arm64.yml,
# which name each installer with its checksum, and the .blockmap files that let the app download only what
# changed. Both macOS builds write latest-mac.yml and both Windows builds latest.yml, each listing only its own
# architecture; the release job merges each pair into one file (scripts/merge-update-info.mjs).
#
# The app carries mu inside it: the harness job packs mu-agent from the same commit (as npm.yml does), and
# every build puts it into the app (desktop/scripts/kyrn/bundle-harness.mjs, through MU_HARNESS_TARBALL).
#
# The app each build made is then started as a person starts it: its own mu alone first, then the whole app holding a
# conversation (desktop/tests/e2e/mu-conversation) twice, on the native host the app uses by default (mu in a process
# of the app's own) and on AionCore (MU_NATIVE_HOST=0), on every system but the Intel Mac: its app, built on an arm64
# runner, sees an arm64 Mac there and asks for the arm64 app instead. On windows-x64 the app its installer puts in
# C:\Program Files\mu holds them too: a path with a space.
#
# Adapted from AionUi's own build pipeline (desktop/.github/workflows/_build-reusable.yml). The macOS builds
# are signed with a Developer ID certificate and notarized with an App Store Connect API key when the
# repository has the secrets (BUILD_CERTIFICATE_BASE64, P12_PASSWORD, KEYCHAIN_PASSWORD, APPLE_TEAM_ID,
# APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_BASE64); without them (a fork) they are unsigned.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  harness:
    name: Pack mu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build pi
        run: npm run build

      - name: Build and pack mu-agent
        run: node kyrn/npm/build.mjs --pack

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: mu-agent-tarball
          path: .artifacts/npm/mu-agent-*.tgz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.platform }}
    needs: harness
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, os: macos-14, arch: arm64, conversation: true, command: 'node scripts/build-with-builder.js arm64 --mac --arm64' }
          - { platform: macos-x64, os: macos-14, arch: x64, command: 'node scripts/build-with-builder.js x64 --mac --x64' }
          - { platform: windows-x64, os: windows-2022, arch: x64, conversation: true, command: 'node scripts/build-with-builder.js x64 --win --x64' }
          - { platform: windows-arm64, os: windows-11-arm, arch: arm64, conversation: true, command: 'node scripts/build-with-builder.js arm64 --win --arm64' }
          - { platform: linux-x64, os: ubuntu-latest, arch: x64, conversation: true, command: 'node scripts/build-with-builder.js x64 --linux --x64' }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, arch: arm64, conversation: true, command: 'node scripts/build-with-builder.js arm64 --linux --arm64' }
    defaults:
      run:
        working-directory: desktop
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      AIONUI_BACKEND_ARCH: ${{ matrix.arch }}
      # Public release downloads (AionCore, Electron) are rate-limited without a token.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mu
        uses: actions/download-artifact@v4
        with:
          name: mu-agent-tarball
          path: ${{ runner.temp }}/mu-agent

      - name: Use this commit's mu
        shell: bash
        run: echo "MU_HARNESS_TARBALL=$(ls "$RUNNER_TEMP"/mu-agent/mu-agent-*.tgz)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ matrix.platform }}-${{ hashFiles('desktop/package.json', 'desktop/bun.lock') }}
          restore-keys: electron-${{ matrix.platform }}-

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "bun install failed (attempt $attempt), retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Run postinstall
        shell: bash
        run: bun run postinstall || true

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev xvfb

      - name: Setup Windows native build tools
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          bun install --global node-gyp
          "WindowsTargetPlatformVersion=10.0.19041.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MSVC ARM64 toolchain
        if: matrix.platform == 'windows-arm64'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install visualstudio2022buildtools --yes --params "'--add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --includeOptional'"

      - name: Setup MSBuild
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      # The Electron header settings belong to these rebuilds only: during `bun install` they would send
      # node-gyp to Electron's server for Node's own headers, which it does not have.
      - name: Rebuild native modules for Electron
        if: "!startsWith(matrix.platform, 'windows')"
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
        run: bunx electron-builder install-app-deps

      # A prebuilt better-sqlite3 first; where none exists (Windows on arm64), compile it with
      # @electron/rebuild, which fetches Electron's headers itself. The flags carry the target, not
      # npm_config_* variables, which would also reach the tools' own installs.
      - name: Rebuild native modules for Electron (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
        run: |
          $electron = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()
          $sqlite = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          # bun install built it for Node; only a binary for Electron counts.
          if (Test-Path $sqlite) { Remove-Item $sqlite }
          Push-Location node_modules/better-sqlite3
          bun x --yes prebuild-install --runtime=electron --target=$electron --platform=win32 --arch=${{ matrix.arch }}
          Pop-Location
          if (-not (Test-Path $sqlite)) { bunx --yes @electron/rebuild --force --only better-sqlite3 --version $electron --arch ${{ matrix.arch }} }
          if (-not (Test-Path $sqlite)) { Write-Error "better-sqlite3 was not built for Electron ($electron, ${{ matrix.arch }})"; exit 1 }

      # The Developer ID certificate goes into a keychain of its own, put on the search list so codesign finds
      # the identity and the intermediate certificate beside it. The App Store Connect API key (.p8) goes
      # into a file whose path electron-builder reads from APPLE_API_KEY.
      - name: Setup macOS code signing
        if: startsWith(matrix.platform, 'macos')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No certificate: building an unsigned app."
            exit 0
          fi
          set -euo pipefail
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning build.keychain | tee "$RUNNER_TEMP/identities.txt"
          if ! grep -q '"Developer ID Application: ' "$RUNNER_TEMP/identities.txt"; then
            echo "::error::The certificate holds no valid Developer ID Application identity (expired or revoked?)."
            exit 1
          fi
          echo "MACOS_SIGNING=true" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/notary"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Prepare the AionCore binary
        shell: bash
        run: node scripts/prepareAioncore.js

      - name: Detach stale disk images
        if: startsWith(matrix.platform, 'macos')
        run: |
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read -r disk; do hdiutil detach "$disk" -force 2>/dev/null || true; done

      # electron-builder reads the homepage from the app's git remote, and desktop/ has no .git of its own
      # here; the Linux package refuses to build without one. A release tag (v0.1.0) is also the app's
      # version, which its "check for updates" compares with the tags of this repository's releases.
      - name: Set the project homepage and version
        shell: bash
        run: |
          npm pkg set homepage="${{ github.server_url }}/${{ github.repository }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then npm pkg set version="${GITHUB_REF_NAME#v}"; fi

      - name: Build installers
        shell: bash
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          # macOS with the secrets set: electron-builder signs with the team's Developer ID identity from the
          # signing keychain (CSC_NAME matches it by team ID; empty means unsigned), with the hardened runtime
          # and desktop/entitlements.plist. It then notarizes the app with the App Store Connect API key
          # (APPLE_API_KEY, the key file's path, comes from the signing step) and staples the ticket to it,
          # before it packs the zip and the disk image.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_NAME: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_API_ISSUER || '' }}
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
        run: ${{ matrix.command }}

      # electron-builder notarizes the app but not the disk image around it. Signed, notarized and stapled,
      # the image itself also passes Gatekeeper when it is opened, even offline.
      - name: Notarize the disk image
        if: startsWith(matrix.platform, 'macos') && env.MACOS_SIGNING == 'true' && env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning build.keychain | awk '/"Developer ID Application: / { print $2; exit }')"
          for dmg in out/*.dmg; do
            codesign --force --timestamp --sign "$identity" "$dmg"
            result="$(xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 1h --output-format json)" || true
            echo "$result"
            status="$(plutil -extract status raw -o - - <<< "$result" 2>/dev/null || true)"
            if [ "$status" != "Accepted" ]; then
              id="$(plutil -extract id raw -o - - <<< "$result" 2>/dev/null || true)"
              if [ -n "$id" ]; then
                xcrun notarytool log "$id" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              fi
              echo "::error::Notarization of $dmg ended with status '${status:-none}'."
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done

      # What a user downloads must pass Gatekeeper: the app, the disk image, the app inside the disk image
      # and the app inside the zip. Any rejection fails the job, before anything is uploaded.
      - name: Check the signature and the notarization
        if: startsWith(matrix.platform, 'macos') && env.MACOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY:-}" ]; then
            echo "::error::The app is signed but was not notarized: the APPLE_API_KEY_BASE64 secret is missing."
            exit 1
          fi
          check_app() {
            echo "== $1"
            codesign --verify --deep --strict --verbose=2 "$1"
            spctl -a -vv -t install "$1" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
            grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"
            spctl -a -vv -t exec "$1"
            xcrun stapler validate "$1"
          }
          check_app "$(find out -maxdepth 2 -name mu.app -type d | head -n 1)"
          for dmg in out/*.dmg; do
            echo "== $dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
            mountpoint="$(mktemp -d)"
            for attempt in 1 2 3; do
              hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$dmg" > /dev/null && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 10
            done
            check_app "$mountpoint/mu.app"
            hdiutil detach "$mountpoint" > /dev/null
          done
          for zip in out/*.zip; do
            unpacked="$(mktemp -d)"
            ditto -x -k "$zip" "$unpacked"
            echo "(from $zip)"
            check_app "$unpacked/mu.app"
          done

      # The app runs the mu it carries on its own binary as Node (ELECTRON_RUN_AS_NODE). That copy is started the same
      # way here, in a throwaway home: version, doctor, sign-in status, import, and the judgment layer over RPC. It runs
      # after the Gatekeeper check, so nothing it may leave in the unpacked app can touch what was checked.
      - name: Start the app's own mu
        shell: bash
        # The x64 Mac app is built on an arm64 runner, where it runs only if Rosetta is there.
        continue-on-error: ${{ matrix.platform == 'macos-x64' }}
        run: node ../kyrn/npm/smoke-app.mjs out ${{ matrix.arch }}

      # Then the whole app holds a conversation, as a person has one: desktop/tests/e2e/mu-conversation on the unpacked
      # app in out/, with the mu and the backend it carries, against a local fake model, in a throwaway profile (home,
      # app data, mu's agent folder, a project). No key, no real model, nothing downloaded. On Windows this is the only
      # place the app is ever run. Linux has no display here: Xvfb is one, a 1280 x 800 screen (xvfb-run's own, 640 x 480
      # at 8 bits, is smaller than the app's narrowest window). This one is held on AionCore, the way the app talked to
      # mu before its native host (the test turns the host off with MU_NATIVE_HOST=0); the next one on the native host.
      - name: Hold a conversation in the app
        id: conversation
        if: matrix.conversation
        shell: bash
        timeout-minutes: 25
        env:
          MU_E2E_ROOT: ${{ runner.temp }}/mu-e2e
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" node scripts/kyrn/e2e-conversation.mjs --app out --arch ${{ matrix.arch }}
          else
            node scripts/kyrn/e2e-conversation.mjs --app out --arch ${{ matrix.arch }}
          fi

      # What the failed conversation left: the Playwright report (a screenshot and the named controls of each failed
      # step), and the profile's logs (main process, renderer, backend with the adapter's errors) and mu's sessions, with
      # mu's own dot folder (hidden files are left out unless asked for). Only the test's fake key was ever in the
      # profile; the files that hold keys (.env, auth.json, models-store.json) stay out all the same.
      - name: Upload the conversation's report and logs
        if: failure() && steps.conversation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: conversation-${{ matrix.platform }}
          path: |
            desktop/tests/e2e/report/mu-conversation
            desktop/tests/e2e/results/mu-conversation
            ${{ runner.temp }}/mu-e2e/logs
            ${{ runner.temp }}/mu-e2e/userData/logs
            ${{ runner.temp }}/mu-e2e/home/Library/Logs
            ${{ runner.temp }}/mu-e2e/home/.mu
            ${{ runner.temp }}/mu-e2e/agent
            !${{ runner.temp }}/mu-e2e/**/.env
            !${{ runner.temp }}/mu-e2e/**/auth.json
            !${{ runner.temp }}/mu-e2e/**/models-store.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # The same conversation on the native host, which the app uses by default: mu runs in a process of the app's own,
      # with no AionCore between them. These are the tests that meet what a system can differ in: a first start, a start
      # with no model, replies that stream, are asked about and stop, a host killed in the middle of a run, the list
      # read from mu's own session files, the panels. Every test file makes its profile in the runner's temporary
      # folder (TMPDIR on macOS and Linux, TEMP and TMP on Windows), so one run holds them all: a passing file takes its
      # profile away, a failing one leaves it for the upload below.
      - name: Hold a conversation in the app on the native host
        id: native
        if: matrix.conversation
        shell: bash
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/mu-e2e-native"
          export TMPDIR="$RUNNER_TEMP/mu-e2e-native" TEMP="$RUNNER_TEMP/mu-e2e-native" TMP="$RUNNER_TEMP/mu-e2e-native"
          specs=(native.spec native-resilience native-firstrun native-home native-panels native-composer)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" node scripts/kyrn/e2e-conversation.mjs --native --app out --arch ${{ matrix.arch }} -- "${specs[@]}"
          else
            node scripts/kyrn/e2e-conversation.mjs --native --app out --arch ${{ matrix.arch }} -- "${specs[@]}"
          fi

      - name: Upload the native conversation's report and logs
        if: failure() && steps.native.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: native-conversation-${{ matrix.platform }}
          path: |
            desktop/tests/e2e/report/mu-native
            desktop/tests/e2e/results/mu-native
            ${{ runner.temp }}/mu-e2e-native/*/logs
            ${{ runner.temp }}/mu-e2e-native/*/userData/logs
            ${{ runner.temp }}/mu-e2e-native/*/home/Library/Logs
            ${{ runner.temp }}/mu-e2e-native/*/home/.mu
            ${{ runner.temp }}/mu-e2e-native/*/agent
            !${{ runner.temp }}/mu-e2e-native/**/.env
            !${{ runner.temp }}/mu-e2e-native/**/auth.json
            !${{ runner.temp }}/mu-e2e-native/**/models-store.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # The same conversation in the app installed where the installer puts it for all users: C:\Program Files\mu.
      # AionCore runs a registration's command only up to its first space, and the conversation above runs the app from
      # D:\a\...\out, a path with none, so it never met that (github.com/qybaihe/mu/issues/4): the installed app
      # registers its launcher by its 8.3 short path. The installer runs as a person's would, silently (/S) and for all
      # users (/allusers, as the runner's administrator).
      - name: Hold a conversation in the app installed in Program Files
        id: installed
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        timeout-minutes: 25
        env:
          MU_E2E_ROOT: ${{ runner.temp }}/mu-e2e-installed
        run: |
          $installer = Get-ChildItem out -File | Where-Object { $_.Name -match '^mu-.+-win-x64\.exe$' } |
            Select-Object -First 1
          if (-not $installer) { throw 'No installer in out/' }
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/allusers' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer ended with exit code $($setup.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'mu'
          if (-not (Test-Path (Join-Path $app 'mu.exe'))) { throw "The installer put no mu.exe in $app" }
          node scripts/kyrn/e2e-conversation.mjs --app $app
          $status = $LASTEXITCODE
          # What the app registered for its launcher, from its log.
          Get-ChildItem $env:MU_E2E_ROOT -Recurse -File -Filter *.log |
            Select-String -Pattern '\[mu\] launcher: ' | Select-Object -First 1 | ForEach-Object { $_.Line }
          exit $status

      - name: Upload the installed app's conversation report and logs
        if: failure() && steps.installed.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: conversation-${{ matrix.platform }}-installed
          path: |
            desktop/tests/e2e/report/mu-conversation
            desktop/tests/e2e/results/mu-conversation
            ${{ runner.temp }}/mu-e2e-installed/logs
            ${{ runner.temp }}/mu-e2e-installed/userData/logs
            ${{ runner.temp }}/mu-e2e-installed/home/.mu
            ${{ runner.temp }}/mu-e2e-installed/agent
            !${{ runner.temp }}/mu-e2e-installed/**/.env
            !${{ runner.temp }}/mu-e2e-installed/**/auth.json
            !${{ runner.temp }}/mu-e2e-installed/**/models-store.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # And the native host in it: pi runs from the app's resources, C:\Program Files\mu\resources\harness, a path with a
      # space, as a process of the app's own.
      - name: Hold a conversation on the native host in the app installed in Program Files
        id: installed-native
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        timeout-minutes: 25
        env:
          MU_E2E_ROOT: ${{ runner.temp }}/mu-e2e-installed-native
        run: |
          $app = Join-Path $env:ProgramFiles 'mu'
          node scripts/kyrn/e2e-conversation.mjs --native --app $app '--' native.spec
          exit $LASTEXITCODE

      - name: Upload the installed app's native conversation report and logs
        if: failure() && steps.installed-native.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: native-conversation-${{ matrix.platform }}-installed
          path: |
            desktop/tests/e2e/report/mu-native
            desktop/tests/e2e/results/mu-native
            ${{ runner.temp }}/mu-e2e-installed-native/logs
            ${{ runner.temp }}/mu-e2e-installed-native/userData/logs
            ${{ runner.temp }}/mu-e2e-installed-native/home/.mu
            ${{ runner.temp }}/mu-e2e-installed-native/agent
            !${{ runner.temp }}/mu-e2e-installed-native/**/.env
            !${{ runner.temp }}/mu-e2e-installed-native/**/auth.json
            !${{ runner.temp }}/mu-e2e-installed-native/**/models-store.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: List what was built
        if: always()
        shell: bash
        run: ls -lh out/ 2>/dev/null || echo "no out/ folder"

      # On macOS the disk image and the zip are separate artifacts, so either can be downloaded alone.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.exe
            desktop/out/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload the macOS zip
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-zip
          path: desktop/out/*.zip
          if-no-files-found: error
          retention-days: 14

      # This build's update feed (latest*.yml) and blockmaps, for the release job to merge and attach. An app
      # whose electron-builder.yml writes no feed only warns here; the release job reports the missing feed.
      - name: Upload the update feed
        uses: actions/upload-artifact@v4
        with:
          name: update-info-${{ matrix.platform }}
          path: |
            desktop/out/latest*.yml
            desktop/out/*.blockmap
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the signing keychain and the API key
        if: always() && startsWith(matrix.platform, 'macos')
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/notary"

  release:
    name: Publish the release
    needs: build
    # A tag publishes what was built, even when one platform failed; the notes say which is missing.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      # One folder per build (update-info/update-info-macos-arm64/latest-mac.yml, ...): the macOS and the
      # Windows builds write feeds of the same name.
      - name: Download the update feed
        uses: actions/download-artifact@v4
        with:
          pattern: update-info-*
          path: update-info

      - name: Source archive and checksums
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="mu-${tag#v}/" -o "dist/mu-${tag#v}-source.tar.gz" HEAD
          cd dist
          sha256sum -- * > SHA256SUMS
          ls -lh

      # electron-updater reads one feed file per system from the newest release and takes its architecture's
      # installer from it, so each system's feed must list the files of both its builds: merged, x64 first. A
      # system with a build missing gets no feed, rather than one that would give the other architecture's
      # build to all of its users; the app then offers the installer instead. The merge also checks each
      # listed file against the attached copy and takes its checksum from there (the macOS job signs and
      # staples the disk image after electron-builder wrote the feed). A problem here fails the job, but only
      # after the release is published: the installers do not wait for the feed.
      - name: Update feed
        id: feed
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -uo pipefail
          mkdir -p updates
          status=0
          # A feed is missing when its build failed; when every build succeeded, that is a defect.
          missing() {
            if [ "$BUILD_RESULT" = "success" ]; then echo "::error::$1"; status=1; else echo "::warning::$1"; fi
          }
          # feed FILE PLATFORM...: FILE from the builds of these platforms, merged in this order.
          feed() {
            local file="$1" platform inputs=()
            shift
            for platform in "$@"; do
              if [ ! -f "update-info/update-info-$platform/$file" ]; then
                missing "No $file in this release: the $platform build wrote none."
                return
              fi
              inputs+=("update-info/update-info-$platform/$file")
            done
            if ! node scripts/merge-update-info.mjs --out "updates/$file" --assets dist "${inputs[@]}"; then
              echo "::error::Could not write $file (see above)."
              status=1
            fi
          }
          # The blockmaps of the attached files; the merge removes one whose file changed after it was made.
          for blockmap in update-info/*/*.blockmap; do
            [ -e "$blockmap" ] || continue
            name="$(basename "$blockmap")"
            if [ -e "dist/${name%.blockmap}" ]; then cp "$blockmap" updates/; fi
          done
          feed latest-mac.yml macos-x64 macos-arm64
          feed latest.yml windows-x64 windows-arm64
          feed latest-linux.yml linux-x64
          feed latest-linux-arm64.yml linux-arm64
          ls -lh updates
          exit "$status"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          # The macOS jobs fail rather than ship an app Gatekeeper rejects, so with these secrets every
          # attached macOS installer is signed and notarized.
          MACOS_NOTARIZED: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.APPLE_API_KEY_BASE64 != '' }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          {
            echo "Preview build of mu ${tag}."
            echo
            echo "- **Desktop app**: macOS (.dmg, .zip), Windows (.exe), Linux (.deb), each for x64 and arm64."
            if [ "$MACOS_NOTARIZED" = "true" ]; then
              echo "- macOS: signed with a Developer ID and notarized by Apple. Windows is not code-signed yet: SmartScreen shows a warning."
            else
              echo "- Not code-signed yet: macOS asks you to confirm the first start in System Settings → Privacy & Security; Windows SmartScreen shows a warning."
            fi
            echo "- The app carries mu inside it: nothing else to install, no Node.js, no download at the first start."
            echo "- The \`mu\` command line: \`npm i -g mu-agent\` (Node.js 22.19 or newer), or from source (the archive below, or a clone)."
            if [ "$BUILD_RESULT" != "success" ]; then
              echo
              echo "⚠️ Not every platform built for this tag; the missing installers are not attached. See the workflow run."
            fi
          } > notes.md
          # The update feed goes along when there is one (SHA256SUMS covers the installers and the source only).
          shopt -s nullglob
          gh release create "$tag" dist/* updates/* --title "mu ${tag}" --notes-file notes.md --prerelease --verify-tag

      - name: Report an incomplete update feed
        if: steps.feed.outcome == 'failure'
        run: |
          echo "::error::The release is published without a complete update feed (see the Update feed step): the app offers the installer on the systems without one."
          exit 1
