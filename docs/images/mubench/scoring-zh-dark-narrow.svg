<svg xmlns="http://www.w3.org/2000/svg" width="360" height="554" viewBox="0 0 360 554" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif'>
<title id="t">mubench 怎么给决策模型打分</title>
<desc id="d">1. 真实请求: mu 在真实编程会话里问决策模型的问题，一字不改，收作一道题。 2. 决策: 被测模型作答：命令直接跑还是先问，结果留下还是丢掉，这一轮算不算完成。 3. 后果: 答案按它带来的后果的代价计分，代价大的错误分量更重。 4. 对照不用决策模型: 这份代价和不用决策模型时的 mu 相比：0 分是一样，100 分是全部消除。</desc>
