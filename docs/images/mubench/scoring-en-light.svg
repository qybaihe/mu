<svg xmlns="http://www.w3.org/2000/svg" width="880" height="318" viewBox="0 0 880 318" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif'>
<title id="t">How mubench scores a decision model</title>
<desc id="d">1. A real request: What mu asked a decision model in a real coding session on an open-source repository, kept word for word as an item. 2. The decision: The model under test answers it: run a command or ask first, keep a result or drop it, call a turn done or not. 3. Its consequences: The answer is scored by the cost of what it leads to. A costly mistake weighs more than a cheap one. 4. Against no decision model: That cost is compared with what mu does with no decision model: 0 is no better, 100 removes all of it.</desc>
