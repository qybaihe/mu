<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title id="t">A decision, end to end</title>
<desc id="d">Six steps, with tool.injection screening a web page as the example. 1: a feature hooks a pi event (web_fetch returns a page). 2: it asks a decision point, tool.injection, with a small state and a bounded question. 3: the engine checks the point’s mode and picks a judge from its tiers (for example laya, then jev), with a fallback. 4: the judge answers, for example yes with probability 0.97 in 0.3 seconds. 5: the ledger records the verdict, its answers, latency and usage as a kyrn.decision entry. 6: in active mode the feature acts and the passage is withheld; in shadow mode it stops at step 5. Without a verdict, mu takes the fallback and the ledger says why.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#818b98"/></marker></defs>
<text x="0" y="22" font-size="18" font-weight="600" fill="#1f2328">A decision, end to end</text>
<text x="0" y="46" font-size="13.5" fill="#59636e">tool.injection screening a web page for instructions aimed at the AI.</text>
<line x1="0" x2="880" y1="66" y2="66" stroke="#d1d9e0"/>
<rect x="0" y="92" width="131.66666666666666" height="128" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="12" y="114" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#5b45db">01</text>
<text x="12" y="138" font-size="13.5" font-weight="600" fill="#1f2328">A feature hooks</text>
<text x="12" y="156" font-size="13.5" font-weight="600" fill="#1f2328">an event</text>
<text x="12" y="180" font-size="12" fill="#59636e">web_fetch returns a</text>
<text x="12" y="196" font-size="12" fill="#59636e">page</text>
<text x="12" y="212" font-size="11" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#818b98">pi event</text>
<path d="M133.66666666666666,156 L146.66666666666666,156" fill="none" stroke="#818b98" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="149.66666666666666" y="92" width="131.66666666666666" height="128" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="161.66666666666666" y="114" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#5b45db">02</text>
<text x="161.66666666666666" y="138" font-size="13.5" font-weight="600" fill="#1f2328">It asks a</text>
<text x="161.66666666666666" y="156" font-size="13.5" font-weight="600" fill="#1f2328">decision point</text>
<text x="161.66666666666666" y="180" font-size="12" fill="#59636e">small state, bounded</text>
<text x="161.66666666666666" y="196" font-size="12" fill="#59636e">question</text>
<text x="161.66666666666666" y="212" font-size="11" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#d6409f">tool.injection</text>
<path d="M283.3333333333333,156 L296.3333333333333,156" fill="none" stroke="#818b98" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="299.3333333333333" y="92" width="131.66666666666666" height="128" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="311.3333333333333" y="114" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#5b45db">03</text>
<text x="311.3333333333333" y="138" font-size="13.5" font-weight="600" fill="#1f2328">The engine picks</text>
<text x="311.3333333333333" y="156" font-size="13.5" font-weight="600" fill="#1f2328">a judge</text>
<text x="311.3333333333333" y="180" font-size="12" fill="#59636e">mode, tiers, a</text>
<text x="311.3333333333333" y="196" font-size="12" fill="#59636e">fallback</text>
<text x="311.3333333333333" y="212" font-size="11" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#818b98">tiers: laya,jev</text>
<path d="M433,156 L446,156" fill="none" stroke="#818b98" stroke-width="1.4" marker-end="url(#a)"/>
