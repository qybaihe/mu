<text x="461" y="114" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#5b45db">04</text>
<rect x="559.6666666666666" y="107" width="6" height="6" rx="1" fill="#d6409f" stroke="rgba(238, 111, 191, 0.22)" stroke-width="2" transform="rotate(45 562.6666666666666 110)"/>
<text x="461" y="138" font-size="13.5" font-weight="600" fill="#1f2328">The judge</text>
<text x="461" y="156" font-size="13.5" font-weight="600" fill="#1f2328">answers</text>
<text x="461" y="180" font-size="12" fill="#59636e">yes 0.97 · in 0.3 s</text>
<text x="461" y="212" font-size="11" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#d6409f">verdict</text>
<path d="M582.6666666666666,156 L595.6666666666666,156" fill="none" stroke="#818b98" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="598.6666666666666" y="92" width="131.66666666666666" height="128" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="610.6666666666666" y="114" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#5b45db">05</text>
<text x="610.6666666666666" y="138" font-size="13.5" font-weight="600" fill="#1f2328">The ledger</text>
<text x="610.6666666666666" y="156" font-size="13.5" font-weight="600" fill="#1f2328">records it</text>
<text x="610.6666666666666" y="180" font-size="12" fill="#59636e">answers, latency,</text>
<text x="610.6666666666666" y="196" font-size="12" fill="#59636e">usage</text>
<text x="610.6666666666666" y="212" font-size="11" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#818b98">kyrn.decision</text>
<path d="M732.3333333333333,156 L745.3333333333333,156" fill="none" stroke="#818b98" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="748.3333333333333" y="92" width="131.66666666666666" height="128" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="760.3333333333333" y="114" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#5b45db">06</text>
<text x="760.3333333333333" y="138" font-size="13.5" font-weight="600" fill="#1f2328">The feature</text>
<text x="760.3333333333333" y="156" font-size="13.5" font-weight="600" fill="#1f2328">acts</text>
<text x="760.3333333333333" y="180" font-size="12" fill="#59636e">the passage is</text>
<text x="760.3333333333333" y="196" font-size="12" fill="#59636e">withheld</text>
<text x="760.3333333333333" y="212" font-size="11" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#818b98">active mode</text>
<text x="0" y="244" font-size="12" fill="#818b98">In shadow mode it stops at 05: the verdict is recorded and nothing changes.</text>
<text x="0" y="262" font-size="12" fill="#818b98">No verdict (slow, down or unsure): the fallback, what mu would do without a judge, and the ledger says why.</text>
</svg>
