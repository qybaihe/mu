<text x="284" y="115" font-size="11.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#818b98">desktop/</text>
<text x="16" y="136" font-size="12.5" fill="#59636e">runs pi in a utility process, over pi’s RPC</text>
<path d="M150,154 L150,182" fill="none" stroke="#818b98" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="324" y="90" width="300" height="62" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="340" y="115" font-size="14.5" font-weight="600" fill="#1f2328">mu command</text>
<text x="608" y="115" font-size="11.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#818b98">kyrn/bin/mu.mjs</text>
<text x="340" y="136" font-size="12.5" fill="#59636e">mu’s own commands, then starts pi</text>
<path d="M474,154 L474,182" fill="none" stroke="#818b98" stroke-width="1.4" marker-end="url(#a)"/>
<text x="648" y="115" font-size="12.5" fill="#59636e">Sessions are pi’s files:</text>
<text x="648" y="134" font-size="12.5" fill="#59636e">the app and the command</text>
<text x="648" y="153" font-size="12.5" fill="#59636e">line share them.</text>
