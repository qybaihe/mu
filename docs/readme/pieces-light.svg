<text x="0" y="378" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#818b98">JUDGES, BY DECISION POINT OR IN TIERS</text>
<rect x="0" y="390" width="211" height="52" rx="10" fill="rgba(238, 111, 191, 0.07)" stroke="rgba(214, 64, 159, 0.4)"/>
