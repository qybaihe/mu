<text x="16" y="214" font-size="14.5" font-weight="600" fill="#1f2328">pi</text>
<text x="36" y="214" font-size="13" fill="#59636e">· the coding agent</text>
<text x="608" y="214" font-size="11.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#818b98">packages/{ai,agent,coding-agent,tui}</text>
<rect x="16" y="228" width="96" height="24" rx="6" fill="none" stroke="#d1d9e0"/>
<text x="64" y="244" font-size="12" text-anchor="middle" fill="#59636e">agent loop</text>
