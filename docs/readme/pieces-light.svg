<text x="218" y="310" font-size="12.5" font-weight="600" fill="#1f2328">decision engine</text>
<text x="218" y="328" font-size="12" fill="#59636e">modes, judges, fallbacks</text>
<text x="406" y="310" font-size="12.5" font-weight="600" fill="#1f2328">ledger</text>
