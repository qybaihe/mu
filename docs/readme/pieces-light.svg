<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title id="t">The pieces</title>
<desc id="d">The desktop app (desktop/, which runs pi in a utility process over pi’s RPC protocol) and the mu command (kyrn/bin/mu.mjs) both start pi, the coding agent: its agent loop, tools, sessions and providers. Inside pi runs the judgment kernel (packages/kyrn-judge): features that hook pi’s events and act on verdicts, a decision engine with modes, judges and fallbacks, and a ledger of every verdict in the session. pi calls the main model, any provider it supports. The engine asks the judges: Jev (hosted, with probabilities), Laya (local, offline), any classifier model or any LLM.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#818b98"/></marker><marker id="p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#d6409f"/></marker></defs>
<text x="0" y="22" font-size="18" font-weight="600" fill="#1f2328">The pieces</text>
<text x="0" y="46" font-size="13.5" fill="#59636e">mu is pi with a judgment kernel loaded as an extension. The desktop app runs the same two.</text>
<line x1="0" x2="880" y1="66" y2="66" stroke="#d1d9e0"/>
<rect x="0" y="90" width="300" height="62" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
