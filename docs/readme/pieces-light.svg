<text x="688" y="214" font-size="14.5" font-weight="600" fill="#1f2328">The main model</text>
<text x="688" y="234" font-size="12.5" fill="#59636e">any provider pi supports,</text>
<text x="688" y="252" font-size="12.5" fill="#59636e">by key or subscription</text>
