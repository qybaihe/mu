<text x="182" y="138" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#8b949e">all</text>
<path d="M408,146 L463,146" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<text x="436" y="138" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#8b949e">unsure</text>
<path d="M662,146 L717,146" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<text x="690" y="138" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#8b949e">unsure</text>
<path d="M309,192 L309,246" fill="none" stroke="#ff8ad8" stroke-width="1.4" marker-end="url(#p)"/>
<text x="317" y="224" font-size="12" fill="#ff8ad8">sure: a verdict</text>
<path d="M563,192 L563,246" fill="none" stroke="#ff8ad8" stroke-width="1.4" marker-end="url(#p)"/>
<text x="571" y="224" font-size="12" fill="#ff8ad8">sure: a verdict</text>
