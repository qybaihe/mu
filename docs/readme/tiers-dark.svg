<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title id="t">Judges in tiers</title>
<desc id="d">A cascade such as laya,jev. All questions go to Laya first: local, offline and free, trusted on classifying. What Laya is sure of becomes a verdict; a yes/no answer is unsure when its probability is between 0.2 and 0.8, and unsure questions go on to Jev, hosted, about 0.3 seconds. What Jev is sure of becomes a verdict; what is still unsure, or what no judge answered, gets the fallback: what mu would do without a judge. The ledger records every answer, which judge gave it or why the fallback was used, and the time. Laya is not trusted on relating, scoring or meta-judgments, so those questions go on to Jev.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8b949e"/></marker><marker id="p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff8ad8"/></marker></defs>
<text x="0" y="22" font-size="18" font-weight="600" fill="#f0f6fc">Judges in tiers</text>
<text x="0" y="46" font-size="13.5" fill="#b7bdc8">A cascade such as laya,jev: each judge only sees the questions the one before it wasn’t sure about.</text>
<line x1="0" x2="880" y1="66" y2="66" stroke="#30363d"/>
<rect x="0" y="104" width="150" height="84" rx="10" fill="#151b23" stroke="#3d444d"/>
<text x="16" y="133" font-size="14.5" font-weight="600" fill="#f0f6fc">Questions</text>
<text x="16" y="156" font-size="12.5" fill="#b7bdc8">one or many,</text>
<text x="16" y="174" font-size="12.5" fill="#b7bdc8">from a decision point</text>
<rect x="214" y="104" width="190" height="84" rx="10" fill="rgba(255, 138, 216, 0.07)" stroke="rgba(255, 138, 216, 0.4)"/>
<rect x="229" y="125" width="6" height="6" rx="1" fill="#ff8ad8" stroke="rgba(255, 138, 216, 0.25)" stroke-width="2" transform="rotate(45 232 128)"/>
<text x="246" y="133" font-size="14.5" font-weight="600" fill="#f0f6fc">Laya</text>
<text x="230" y="156" font-size="12.5" fill="#b7bdc8">local, offline, no cost</text>
<text x="230" y="174" font-size="12.5" fill="#b7bdc8">trusted on classifying</text>
<rect x="468" y="104" width="190" height="84" rx="10" fill="rgba(255, 138, 216, 0.07)" stroke="rgba(255, 138, 216, 0.4)"/>
<rect x="483" y="125" width="6" height="6" rx="1" fill="#ff8ad8" stroke="rgba(255, 138, 216, 0.25)" stroke-width="2" transform="rotate(45 486 128)"/>
<text x="500" y="133" font-size="14.5" font-weight="600" fill="#f0f6fc">Jev</text>
<text x="484" y="156" font-size="12.5" fill="#b7bdc8">hosted, about 0.3 s</text>
<text x="484" y="174" font-size="12.5" fill="#b7bdc8">trusted on every kind</text>
<rect x="722" y="104" width="158" height="84" rx="10" fill="#151b23" stroke="#3d444d"/>
<text x="738" y="133" font-size="14.5" font-weight="600" fill="#f0f6fc">The fallback</text>
<text x="738" y="156" font-size="12.5" fill="#b7bdc8">what mu would do</text>
<text x="738" y="174" font-size="12.5" fill="#b7bdc8">without a judge</text>
