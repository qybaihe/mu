<rect x="200" y="252" width="680" height="34" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="216" y="274" font-size="12.5" fill="#b7bdc8">The ledger: every answer, which judge gave it or why the fallback was used, and the time.</text>
<text x="0" y="258" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" letter-spacing="0.9" fill="#8b949e">UNSURE MEANS</text>
<rect x="0" y="268" width="170" height="8" rx="4" fill="#151b23" stroke="#3d444d"/>
<rect x="34" y="268" width="102" height="8" rx="0" fill="rgba(255, 138, 216, 0.07)" stroke="rgba(255, 138, 216, 0.4)"/>
<text x="34" y="290" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#8b949e">0.2</text>
<text x="136" y="290" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" fill="#8b949e">0.8</text>
<text x="0" y="324" font-size="12" fill="#8b949e">A judge’s known weakness never decides: Laya isn’t trusted on relating, scoring or meta-judgments, so those go on to Jev.</text>
