<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title id="t">How a turn works</title>
<desc id="d">Four stages of a turn, each with the decision points it asks the judge. A message arrives, before the model reads it: input.preflight (what kind of task is this?), task.frame (does the task change?), input.interjection (interrupt now, or after?), skills.disclosure (which skills to load?), memory.recall (which lessons apply?). Before a tool runs, rules first, then the judge: tool.risk (flagged: did you ask?), tool.constraint (crosses your rule?), tool.approval (does the task need it?). What comes back, before the model sees it: tool.injection (orders aimed at the AI?), tool.admission (does this chunk matter?), context.forget (which results are stale?), context.compact (keep this passage?). The turn ends, before you hear it’s done: turn.completion (was it verified?), turn.continue (did it stop short?), turn.drift (still on the goal?), memory.capture (a lesson to keep?), cache.warming (back before it expires?). The model loops over stages 2 and 3: call a tool, run it, read what came back. Every stage asks the same judge: Jev, Laya, a classifier or any LLM, one bounded question in about 0.3 seconds, and every verdict goes to the ledger.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#818b98"/></marker><marker id="v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b45db"/></marker></defs>
<text x="0" y="22" font-size="18" font-weight="600" fill="#1f2328">How a turn works</text>
<text x="0" y="46" font-size="13.5" fill="#59636e">At each step, a decision point asks the judge one short question. Its answer changes what happens next.</text>
