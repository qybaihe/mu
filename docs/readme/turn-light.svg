<text x="40" y="487" font-size="14.5" font-weight="600" fill="#1f2328">The judge</text>
<text x="122" y="487" font-size="13" fill="#59636e">Jev (hosted), Laya (local), a classifier or any LLM: one bounded question, about 0.3 s.</text>
<text x="40" y="507" font-size="12.5" fill="#818b98">Every verdict goes to the ledger with its probabilities. Without one, mu does what it would do without a judge.</text>
<text x="0" y="554" font-size="12" fill="#818b98">18 of the 40 decision points. Each one is active, shadow (asked and logged only) or off.</text>
